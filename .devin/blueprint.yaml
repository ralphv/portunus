# Devin repo blueprint: https://docs.devin.ai/onboard-devin/environment/blueprint-reference
# Keep in sync with the Commands/Environment sections of AGENTS.md and README.md.
initialize:
  - name: Install Node.js 24
    run: |
      curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
      sudo apt-get install -y nodejs
      node -v
maintenance:
  - name: Install dependencies
    run: npm install
knowledge:
  - name: node-path
    contents: |
      Node 24 comes from nvm on this box (not NodeSource) and isn't on
      PATH in fresh exec shells — run `source ~/.nvm/nvm.sh` first.
  - name: test
    contents: npm test
  - name: lint
    contents: npm run lint
  - name: build
    contents: npm run build
  - name: smoke
    contents: |
      End-to-end smoke test against a running demo-mode server (needs
      `npx playwright install --with-deps chromium`):
      `npm run deploy:local` (prod Docker image, demo mode, :3001) then `npm run smoke`,
      or `PORTUNUS_DEMO_MODE=1 npm run dev` then `BASE_URL=http://localhost:3000 npm run smoke`.
      `npm run full-smoke` does build + throwaway container (:3002) + smoke + cleanup in one go;
      `npm run full-smoke-with-screenshots` also saves a screenshot per step in ./smoke-artifacts/steps/.
      Tests live in scripts/smoke/tests/ (order: scripts/smoke/tests.mjs); see SMOKE.md.
      Optional flags, set for both the server and the smoke run:
      DISABLE_OFFLINE_MODE=1, PORTUNUS_BIOMETRIC_UNLOCK=1, PORTUNUS_BIOMETRIC_SAVE_CONFIRM=0.
  - name: startup
    contents: |
      npm run dev  # Next.js dev server on http://localhost:3000
  - name: secrets
    contents: |
      Dev server / OAuth sign-in needs AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, AUTH_SECRET, AUTH_URL
      (e.g. http://localhost:3000), stored as Devin secrets and never committed.
      It also needs PORTUNUS_SIGNING_PRIVATE_KEY (generate a throwaway one:
      `openssl genpkey -algorithm ed25519 | openssl pkey -outform DER | base64 | tr -d '\n'`)
      or PORTUNUS_SIGNATURES_DISABLED=1.
      Not needed for test, lint, or build. Pass them as env vars to `npm run dev`
      or write them to the gitignored .env.local at session time.
      Not needed in demo mode: `PORTUNUS_DEMO_MODE=1 npm run dev` (stubbed sign-in,
      in-memory vault; works under `next start` / Docker too). `node scripts/record-demo.mjs` records the README demo
      against it (needs `npx playwright install chromium` and ffmpeg).
