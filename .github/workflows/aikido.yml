# Aikido security scan, opt-in per commit to save scan credits.
#
# Runs only when the latest commit message contains "aikido" (any case), or
# when started by hand from the Actions tab. Every other push and pull request
# skips the scan.
#
# Setup (outside the repo):
#   1. Aikido dashboard: turn off the GitHub App's automatic PR checks
#      ("PR gating") for this repository.
#   2. Aikido → Settings → Integrations → Continuous integration: create a
#      CI token and save it as the repository secret AIKIDO_SECRET_KEY.

name: Aikido Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikido-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aikido-security:
    runs-on: ubuntu-latest
    # The scan itself waits at most timeout-seconds (180); this caps the job.
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The PR's own head commit, not GitHub's merge commit, so the gate
          # below reads the message the author wrote.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Opt-in check (commit message mentions aikido)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || git log -1 --format=%B | grep -qi aikido; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aikido scan skipped: the latest commit message doesn't mention aikido."
          fi

      - name: Detect new vulnerabilities
        if: steps.gate.outputs.run == 'true'
        uses: AikidoSec/github-actions-workflow@v1.0.13
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          fail-on-timeout: true
          fail-on-dependency-scan: true
          fail-on-sast-scan: false
          fail-on-iac-scan: false
          minimum-severity: 'CRITICAL'
          timeout-seconds: 180
          post-scan-status-comment: 'off'
          post-sast-review-comments: 'off'
