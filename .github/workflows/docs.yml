# Builds the VitePress docs site in docs/ on every PR that touches it, and
# deploys it to GitHub Pages from main. Deploying needs Pages enabled once:
# Settings → Pages → Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/docs.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; let an in-flight one finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
    - run: npm ci
    # Fails on dead links between pages, broken #anchors, and links to repo
    # files/headings that don't exist (scripts/check-repo-links.mjs).
    - run: npm run docs:build
    - if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
